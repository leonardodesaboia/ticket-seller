name: CD

# Triggers after CI passes on main, or manually for targeted deploys/rollbacks.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Commit SHA to deploy (leave empty = latest green build on main)'
        required: false
        default: ''

# Never run two production deploys simultaneously.
concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write   # Required to push images to GHCR

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Build all three production images and push to GitHub Container Registry.
  # ─────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    # On workflow_run: only proceed when CI was successful.
    # On workflow_dispatch: always proceed (operator is explicitly requesting).
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      image_tag: ${{ steps.tag.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Resolve the image tag. Priority:
      #   1. Manual override from workflow_dispatch input
      #   2. SHA of the CI run that triggered this CD
      #   3. Current HEAD SHA (fallback)
      - name: Resolve image tag
        id: tag
        env:
          MANUAL_TAG: ${{ inputs.image_tag }}
          WF_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -n "${MANUAL_TAG}" ]; then
            echo "sha=${MANUAL_TAG}" >> $GITHUB_OUTPUT
          elif [ -n "${WF_RUN_SHA}" ]; then
            echo "sha=${WF_RUN_SHA}" >> $GITHUB_OUTPUT
          else
            echo "sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ticket-seller-api:${{ steps.tag.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/ticket-seller-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push Marketplace image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/marketplace-web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ticket-seller-marketplace:${{ steps.tag.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/ticket-seller-marketplace:latest
          cache-from: type=gha,scope=marketplace
          cache-to: type=gha,scope=marketplace,mode=max

      - name: Build and push Backoffice image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backoffice-web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ticket-seller-backoffice:${{ steps.tag.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/ticket-seller-backoffice:latest
          cache-from: type=gha,scope=backoffice
          cache-to: type=gha,scope=backoffice,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # Deploy to the production VPS via SSH.
  #
  # Required GitHub secrets (Settings > Secrets > Actions):
  #   DEPLOY_HOST      VPS IP or hostname
  #   DEPLOY_USER      SSH user on the server
  #   DEPLOY_KEY       SSH private key (public key must be in authorized_keys)
  #   GHCR_TOKEN       GitHub PAT with read:packages scope (for server image pull)
  #
  # Required on the VPS:
  #   /opt/ticket-seller/docker-compose.prod.yml
  #   /opt/ticket-seller/.env   (production env vars; IMAGE_TAG and *_IMAGE updated here)
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production   # Enables manual approval gate in GitHub Environments

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          # Values resolved at workflow level, passed as env vars to the remote
          # script. No ${{ }} expressions appear inside the script block.
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          OWNER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          envs: IMAGE_TAG,OWNER,GHCR_TOKEN,ACTOR
          script: |
            set -euo pipefail

            # Authenticate with GHCR so the server can pull the new images.
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${ACTOR}" --password-stdin

            # Pull new images while old containers still serve traffic.
            # Minimises downtime window to container swap time only.
            docker pull "ghcr.io/${OWNER}/ticket-seller-api:${IMAGE_TAG}"
            docker pull "ghcr.io/${OWNER}/ticket-seller-marketplace:${IMAGE_TAG}"
            docker pull "ghcr.io/${OWNER}/ticket-seller-backoffice:${IMAGE_TAG}"

            cd /opt/ticket-seller

            # Helper: upsert a key=value line in .env
            update_env() {
              local key="$1" val="$2"
              if grep -q "^${key}=" .env 2>/dev/null; then
                sed -i "s|^${key}=.*|${key}=${val}|" .env
              else
                echo "${key}=${val}" >> .env
              fi
            }
            update_env API_IMAGE         "ghcr.io/${OWNER}/ticket-seller-api"
            update_env MARKETPLACE_IMAGE "ghcr.io/${OWNER}/ticket-seller-marketplace"
            update_env BACKOFFICE_IMAGE  "ghcr.io/${OWNER}/ticket-seller-backoffice"
            update_env IMAGE_TAG         "${IMAGE_TAG}"

            # Run database migrations before swapping the API container.
            docker compose -f docker-compose.prod.yml run --rm api-migrate

            # Restart API first, then frontends.
            docker compose -f docker-compose.prod.yml up -d --no-deps api
            docker compose -f docker-compose.prod.yml up -d --no-deps marketplace backoffice

            # Wait for API health check to pass before declaring success.
            echo "Waiting for API to become healthy..."
            timeout 90 bash -c \
              'until docker compose -f docker-compose.prod.yml exec -T api \
                wget -qO- http://localhost:3000/api/v1/health/live > /dev/null 2>&1; \
              do sleep 3; done'
            echo "Deployment complete — API is healthy."

            # Remove dangling images to reclaim disk space.
            docker image prune -f
